# 도메인 + HTTPS 로 쓸 때 함께 적용되는 설정입니다.
#
#   ./deploy.sh https <도메인> <이메일>
#
# 위 명령을 실행하면 .env 에 ITAM_DOMAIN 이 기록되고, 그때부터 deploy.sh 의
# 모든 명령이 이 파일을 자동으로 함께 적용합니다. 직접 실행할 일은 없습니다.

services:
  app:
    # 바깥에서는 Nginx 를 거쳐서만 들어오게 한다.
    # 서버 자신에게만 열어 두어, 점검할 때 curl 로 확인할 수 있게 남겨 둔다.
    ports: !override
      - "127.0.0.1:${ITAM_LOCAL_PORT:-8001}:8000"

  nginx:
    ports: !override
      - "80:80"
      - "443:443"
      # 예전에 인쇄한 QR 라벨이 가리키는 포트. HTTPS 주소로 넘겨준다.
      - "${ITAM_PUBLIC_PORT:-8000}:8000"
    volumes: !override
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/letsencrypt:ro
      - ./deploy/certbot-webroot:/var/www/certbot:ro
    # 인증서가 갱신되면 반영되도록 하루 두 번 설정을 다시 읽는다
    command: sh -c "while :; do sleep 12h; nginx -s reload; done & exec nginx -g 'daemon off;'"

  # 인증서 자동 갱신. Let's Encrypt 인증서는 90일짜리라 갱신이 필수다.
  certbot:
    image: certbot/certbot:latest
    container_name: itam-certbot
    profiles: ["https"]
    restart: unless-stopped
    volumes:
      - ./deploy/certs:/etc/letsencrypt
      - ./deploy/certbot-webroot:/var/www/certbot
    # 12시간마다 확인하고, 만료가 가까운 것만 실제로 갱신한다.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
