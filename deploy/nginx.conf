# 사내 도메인 + HTTPS 로 전환할 때 사용하는 Nginx 설정입니다.
# 평소에는 사용되지 않습니다. 자세한 절차는 deploy/README-HTTPS.md 를 보세요.
#
#   docker compose --profile https up -d

# HTTP 로 들어온 요청은 HTTPS 로 넘긴다
server {
    listen 80;
    server_name itam.example.co.kr;   # ← 사내 도메인으로 바꾸세요

    # 인증서 자동 갱신(certbot)을 쓸 경우를 위해 이 경로만 예외로 둔다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name itam.example.co.kr;   # ← 사내 도메인으로 바꾸세요

    # deploy/certs/ 폴더에 넣어 둔 인증서 파일 이름과 맞춰 주세요
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 엑셀 업로드가 막히지 않도록 넉넉히 잡는다 (앱 기본 제한은 10MB)
    client_max_body_size 20m;

    access_log /var/log/nginx/itam-access.log;
    error_log  /var/log/nginx/itam-error.log;

    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # 앱이 실제 접속자 IP 와 https 여부를 알 수 있게 넘겨준다.
        # (컨테이너는 --proxy-headers 옵션으로 이 값들을 신뢰하도록 실행된다)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 엑셀 다운로드가 큰 경우를 대비해 여유를 준다
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
