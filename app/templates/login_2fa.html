<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>인증 코드 입력 · {{ APP_NAME }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>💻</text></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>인증 코드 입력</h1>
    <p class="sub">인증 앱에 보이는 6자리 숫자를 넣어 주세요.</p>

    {% for item in flashes %}
      <div class="alert {{ item.category }}">{{ item.message }}</div>
    {% endfor %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/login/2fa">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="code">인증 코드</label>
        <input type="text" id="code" name="code"
               inputmode="numeric" autocomplete="one-time-code"
               maxlength="12" placeholder="000000"
               style="font-size:20px; letter-spacing:4px; text-align:center;"
               autofocus required>
        <div class="hint">코드는 30초마다 바뀝니다.</div>
      </div>
      <button type="submit" class="btn primary">확인</button>
    </form>

    <p class="foot">
      휴대폰을 쓸 수 없다면 <strong>복구 코드</strong>를 위 칸에 입력하세요.<br>
      <a href="/login">다른 계정으로 로그인</a>
    </p>
  </div>
</div>
</body>
</html>
