<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · {{ APP_NAME }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14'>💻</text></svg>">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <h1>{{ APP_NAME }}</h1>
    <p class="sub">사내 계정으로 로그인해 주세요.</p>

    {% for item in flashes %}
      <div class="alert {{ item.category }}">{{ item.message }}</div>
    {% endfor %}
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="username">아이디</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn primary">로그인</button>
    </form>

    <p class="foot">계정 문의는 IT 운영팀에 요청해 주세요.</p>
  </div>
</div>
</body>
</html>
