{% extends "base.html" %}
{% block page_title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h2>비밀번호 변경</h2>
  <div class="card-body">
    <form method="post" action="/me/password">
      <div class="field" style="margin-bottom:14px;">
        <label for="current_password">현재 비밀번호<span class="req">*</span></label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
      </div>
      <div class="field" style="margin-bottom:14px;">
        <label for="new_password">새 비밀번호<span class="req">*</span></label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
        <div class="hint">8자 이상, 숫자만으로는 설정할 수 없습니다.</div>
      </div>
      <div class="field">
        <label for="confirm_password">새 비밀번호 확인<span class="req">*</span></label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">변경하기</button>
        <a href="/" class="btn">취소</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
