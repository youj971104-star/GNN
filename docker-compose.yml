# IT 자산관리 시스템 - 운영 실행 설정
#
#   시작:  docker compose up -d
#   중지:  docker compose down
#   로그:  docker compose logs -f
#
# 설정값은 같은 폴더의 .env 파일에서 읽습니다. (./deploy.sh setup 으로 생성)

services:
  app:
    build: .
    image: itam:1.0.0
    container_name: itam-app
    restart: unless-stopped

    # 호스트의 ITAM_PUBLIC_PORT 번 포트로 들어온 요청을 컨테이너 8000 번으로 넘긴다.
    # 사내망에서 http://<서버IP>:<포트> 로 접속하게 된다.
    ports:
      - "${ITAM_PUBLIC_PORT:-8000}:8000"

    environment:
      # --- 필수 ---
      ITAM_SECRET_KEY: "${ITAM_SECRET_KEY:?deploy.sh setup 을 먼저 실행해 .env 를 만들어 주세요}"

      # --- 최초 관리자 계정 (첫 로그인 후 비밀번호를 바꾸세요) ---
      ITAM_ADMIN_USERNAME: "${ITAM_ADMIN_USERNAME:-admin}"
      ITAM_ADMIN_PASSWORD: "${ITAM_ADMIN_PASSWORD:-admin1234}"

      # --- 운영 옵션 ---
      ITAM_WORKERS: "${ITAM_WORKERS:-2}"
      ITAM_PAGE_SIZE: "${ITAM_PAGE_SIZE:-20}"
      ITAM_SESSION_MAX_AGE: "${ITAM_SESSION_MAX_AGE:-43200}"
      ITAM_MAX_UPLOAD_BYTES: "${ITAM_MAX_UPLOAD_BYTES:-10485760}"

      # 도메인 + HTTPS 로 전환할 때 1 로 바꾸면 세션 쿠키가 HTTPS 로만 전송된다.
      ITAM_HTTPS_ONLY: "${ITAM_HTTPS_ONLY:-0}"

    volumes:
      # 자산 데이터(SQLite 파일)는 컨테이너를 지웠다 다시 만들어도 남아 있어야 한다.
      # 백업 파일은 './deploy.sh backup' 이 이 볼륨에서 호스트로 꺼내 준다.
      - itam-data:/data

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ── 나중에 사내 도메인 + HTTPS 로 전환할 때만 사용합니다 ──
  # 평소에는 실행되지 않고, 아래 명령으로 함께 띄웁니다.
  #   docker compose --profile https up -d
  # 자세한 준비 사항은 deploy/README-HTTPS.md 를 참고하세요.
  nginx:
    image: nginx:1.27-alpine
    container_name: itam-nginx
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  itam-data:
    name: itam-data
